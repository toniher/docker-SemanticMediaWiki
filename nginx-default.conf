# SMW HTTP server
server {

    listen 80;
    server_name localhost 127.0.0.1;
    server_name_in_redirect off;

    access_log /var/log/nginx/smw.access.log;
    error_log /var/log/nginx/smw.error.log;

    # Use utf-8
    charset utf-8;
    source_charset utf-8;

    # output compression saves bandwidth
    gzip on;
    gzip_http_version 1.0;
    gzip_comp_level 2;
    gzip_proxied any;
    gzip_types text/plain text/css application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Default index
    index index.html index.php;

    root /var/www;

    location ^~ /wiki {
        rewrite ^/wiki/redirect.php /w/redirect.php last;
        rewrite ^/wiki/index.php /w/index.php last;
        rewrite ^/wiki/?(.*)$ /w/index.php?title=$1 last;
    }

    # Serve .php files using fast-cgi
    location ~ .php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Images — no PHP execution, required from MW 1.40+
    location /w/images {
        add_header X-Content-Type-Options "nosniff";
        location ~ \.(html?|shtml|phtml)$ {
            default_type text/plain;
        }
    }
    location /w/images/deleted {
        deny all;
    }

    # MediaWiki core assets
    location ~ ^/w/resources/(assets|lib|src) {
        try_files $uri =404;
        add_header Cache-Control "public";
        expires 7d;
    }

    # Skin and extension static assets
    location ~ ^/w/(skins|extensions)/.+\.(css|js|gif|jpg|jpeg|png|svg|wasm|ttf|woff|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public";
        expires 7d;
    }

    # License and credits files
    location ~ ^/w/(COPYING|CREDITS)$ {
        default_type text/plain;
    }

    # MediaWiki REST API
    location /w/rest.php/ {
        try_files $uri $uri/ /w/rest.php?$query_string;
    }

    location /w/img_auth.php/ {
        try_files $uri $uri/ /w/img_auth.php?$query_string;
    }

}
